name: F1 lineup watch

on:
  schedule:
    # Race days only: Sat/Sun/Mon UTC (Mon catches late Americas races)
    - cron: "17 */2 * * 0,1,6"
  workflow_dispatch:          # "Run workflow" button for manual checks

permissions:
  contents: write             # lets the job commit state.json

concurrency: f1-lineup-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check lineups
        run: python f1_lineup_watch.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Save state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "f1-lineup-bot"
            git config user.email "f1-lineup-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update F1 lineup state"
            git push
          fi
